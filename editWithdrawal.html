    .ui.sidebar.right.visible { right: 0 !important; }
    .sidebar-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 9999;
    }

<div class="pusher">
  <nav class="top-nav inner inner-new">
    <div class="top-bar">
      <div class="head-row clearfix">
        <div class="float-left">
          <div class="logosm">
            <a href="adminDashboard.html"><img src="./assets/img/logo.png" alt="247Expertstrade"></a>
          </div>
        </div>
        <span class="menu-toggle float-right" id="menuToggleBtn"><i></i></span>
        <div class="float-right nav smcapy-nav">
          <div class="item" id="top-admin-name">Admin</div>
          <div class="item">
            <a class="ui button op link a-green-hover" href="#" id="topLogoutBtn">
              <i class="fa fa-power-off"></i> Exit
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="root-content">
    <div class="admin-wrap">
      <h2>Edit Withdrawal</h2>

      <div id="loadingState" class="text-center py-5">
        <i class="fa fa-spinner fa-spin fa-2x"></i>
        <p class="mt-2">Loading withdrawal details...</p>
      </div>

      <div id="errorState" class="alert alert-danger d-none"></div>

      <div class="card d-none" id="editCard">
        <div class="card-body">
          <form id="editWithdrawalForm">
            <div class="mb-3">
              <label class="form-label">User</label>
              <p class="form-control-static" id="ownerDisplay">—</p>
            </div>

            <div class="mb-3">
              <label for="amount" class="form-label">Amount</label>
              <input type="number" name="amount" id="amount" class="form-control" step="0.01" min="0" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Type</label>
              <p class="form-control-static" id="typeDisplay">—</p>
            </div>

            <!-- Crypto fields -->
            <div id="cryptoFields" class="d-none">
              <div class="mb-3">
                <label for="walletAddress" class="form-label">Wallet Address</label>
                <input type="text" name="walletAddress" id="walletAddress" class="form-control">
              </div>
            </div>

            <!-- CashApp fields -->
            <div id="cashAppFields" class="d-none">
              <div class="mb-3">
                <label for="cashAppTag" class="form-label">CashApp Tag</label>
                <input type="text" name="cashAppTag" id="cashAppTag" class="form-control">
              </div>
            </div>

            <!-- PayPal fields -->
            <div id="paypalFields" class="d-none">
              <div class="mb-3">
                <label for="paypalEmail" class="form-label">PayPal Email</label>
                <input type="email" name="paypalEmail" id="paypalEmail" class="form-control">
              </div>
            </div>

            <!-- Bank Transfer fields -->
            <div id="bankFields" class="d-none">
              <div class="mb-3">
                <label for="bankName" class="form-label">Bank Name</label>
                <input type="text" name="bankName" id="bankName" class="form-control">
              </div>
              <div class="mb-3">
                <label for="accountNumber" class="form-label">Account Number</label>
                <input type="text" name="accountNumber" id="accountNumber" class="form-control">
              </div>
              <div class="mb-3">
                <label for="country" class="form-label">Country</label>
                <input type="text" name="country" id="country" class="form-control">
              </div>
              <div class="mb-3">
                <label for="swiftCode" class="form-label">Swift Code</label>
                <input type="text" name="swiftCode" id="swiftCode" class="form-control">
              </div>
            </div>

            <div class="mb-3">
              <label for="status" class="form-label">Status</label>
              <select name="status" id="status" class="form-select" required>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="narration" class="form-label">Narration</label>
              <textarea name="narration" id="narration" class="form-control" rows="3"></textarea>
            </div>

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary">Update</button>
              <a href="allWidthdrawals.html" class="btn btn-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="/frontend/public/js/config.js"></script>
<script src="/frontend/public/js/auth.js"></script>

<script>
  // Sidebar toggle
  (function () {
    const sidebar = document.getElementById('mainSidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const toggleBtn = document.getElementById('menuToggleBtn');

    function openSidebar() {
      if (sidebar) sidebar.classList.add('visible');
      if (overlay) overlay.classList.add('active');
      document.body.classList.add('dimmed');
    }
    function closeSidebar() {
      if (sidebar) sidebar.classList.remove('visible');
      if (overlay) overlay.classList.remove('active');
      document.body.classList.remove('dimmed');
    }
    function toggleSidebar() {
      if (sidebar && sidebar.classList.contains('visible')) closeSidebar();
      else openSidebar();
    }

    if (toggleBtn) {
      toggleBtn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        toggleSidebar();
      });
    }
    if (overlay) overlay.addEventListener('click', closeSidebar);
    if (sidebar) {
      sidebar.querySelectorAll('a').forEach(link => link.addEventListener('click', closeSidebar));
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSidebar(); });
  })();

  // Logout
  document.getElementById('adminLogoutBtn')?.addEventListener('click', e => { e.preventDefault(); logout(); });
  document.getElementById('topLogoutBtn')?.addEventListener('click', e => { e.preventDefault(); logout(); });
</script>
</body>
</html>
