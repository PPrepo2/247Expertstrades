<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1">
  <link rel="icon" type="image/png" href="./assets/img/favicons/favicon-32x32.png" sizes="32x32">
  <link href="./assets/css/css.css" rel="stylesheet" type="text/css">
  <link rel="stylesheet" type="text/css" href="./assets/css/inner.css">
  <link rel="stylesheet" type="text/css" href="./assets/css/app.css">
  <link rel="stylesheet" type="text/css" href="./assets/css/cs.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <script src="https://use.fontawesome.com/4b789087e7.js"></script>
  <style>
    body { background: #0d0d0d; color: #fff; }
    .divider { border-bottom: 1px dotted; }
    .ui.sidebar.right {
      position: fixed !important; top: 0; right: -280px; width: 260px; height: 100%;
      z-index: 10000; transition: right 0.3s ease; overflow-y: auto; padding-top: 90px !important;
    }
    .ui.sidebar.right.visible { right: 0 !important; }
    .sidebar-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 9999;
    }
    .sidebar-overlay.active { display: block; }
    .menu-toggle { cursor: pointer !important; }
    .admin-wrap { padding: 24px 16px 80px; max-width: 900px; margin: 0 auto; }
    .admin-wrap h2 { color: #fff; margin-bottom: 20px; }
    .card { background: #171717; border: none; border-radius: 0.5rem; }
    .form-control, .form-select {
      background: #1a1a2e; color: #fff; border: 1px solid #444;
    }
    .form-control:focus, .form-select:focus {
      background: #1a1a2e; color: #fff; border-color: #2597c7; box-shadow: none;
    }
    .form-control-static { padding: 0.5rem 0; color: #ccc; }
    .btn-primary { background-color: #286090; border-color: #286090; }
    .btn-primary:hover { background-color: #1f4a6b; border-color: #1f4a6b; }
    label { color: #ddd; font-weight: 500; }
  </style>
</head>
<body class="pushable dimmable scrolling">

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="ui sidebar right inverted vertical menu" id="mainSidebar">
  <div class="item" style="font-size:small;color:#fff;position:absolute;top:15px;width:90%;">
    <span id="admin-sidebar-email"><i class="fa fa-envelope-o"></i> Admin</span><br>
    <span id="admin-sidebar-name" style="margin-top:8px;"><b>Loading...</b></span>
  </div>
  <span class="divider"></span>
  <div class="item"><a href="adminDashboard.html"><i class="fa fa-dashboard"></i> Users</a></div>
  <div class="item"><a href="allFunding.html"><i class="fa fa-money"></i> All Deposits</a></div>
  <div class="item"><a href="allWidthdrawals.html"><i class="fa fa-money"></i> All Withdrawals</a></div>
  <div class="item"><a href="all-livetrade.html"><i class="fa fa-area-chart"></i> All Trades</a></div>
  <div class="item"><a href="allVerify.html"><i class="fa fa-check-circle"></i> Verifications</a></div>
  <div class="item"><a href="wallets.html"><i class="fa fa-credit-card"></i> Wallets</a></div>
  <span class="divider"></span>
  <div class="item"><a href="#" id="adminLogoutBtn"><i class="fa fa-power-off"></i> Exit</a></div>
</div>

<div class="pusher">
  <nav class="top-nav inner inner-new">
    <div class="top-bar">
      <div class="head-row clearfix">
        <div class="float-left">
          <div class="logosm">
            <a href="adminDashboard.html"><img src="./assets/img/logo.png" alt="247Expertstrade"></a>
          </div>
        </div>
        <span class="menu-toggle float-right" id="menuToggleBtn"><i></i></span>
        <div class="float-right nav smcapy-nav">
          <div class="item" id="top-admin-name">Admin</div>
          <div class="item">
            <a class="ui button op link a-green-hover" href="#" id="topLogoutBtn">
              <i class="fa fa-power-off"></i> Exit
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="root-content">
    <div class="admin-wrap">
      <h2>Edit Trade</h2>

      <div id="loadingState" class="text-center py-5">
        <i class="fa fa-spinner fa-spin fa-2x"></i>
        <p class="mt-2">Loading trade details...</p>
      </div>

      <div id="errorState" class="alert alert-danger d-none"></div>

      <div class="card d-none" id="editCard">
        <div class="card-body">
          <form id="editTradeForm">
            <div class="mb-3">
              <label class="form-label">Owner</label>
              <p class="form-control-static" id="ownerDisplay">—</p>
            </div>

            <div class="mb-3">
              <label for="type" class="form-label">Trading Type</label>
              <input type="text" name="type" id="type" class="form-control" placeholder="e.g. Turbo, CRYPTOCURRENCY, FOREX">
            </div>

            <div class="mb-3">
              <label for="currencypair" class="form-label">Currency Pair</label>
              <input type="text" name="currencypair" id="currencypair" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="action" class="form-label">Action</label>
              <select name="action" id="action" class="form-select" required>
                <option value="Call">Call</option>
                <option value="Put">Put</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="amount" class="form-label">Amount</label>
              <input type="number" name="amount" id="amount" class="form-control" step="0.01" min="0">
            </div>

            <div class="mb-3">
              <label for="lotsize" class="form-label">Lot Size</label>
              <input type="number" name="lotsize" id="lotsize" class="form-control" step="0.01" min="0">
            </div>

            <div class="mb-3">
              <label for="entryPrice" class="form-label">Entry Price</label>
              <input type="number" name="entryPrice" id="entryPrice" class="form-control" step="0.00001" min="0">
            </div>

            <div class="mb-3">
              <label for="stopLoss" class="form-label">Stop Loss</label>
              <input type="number" name="stopLoss" id="stopLoss" class="form-control" step="0.00001" min="0">
            </div>

            <div class="mb-3">
              <label for="takeProfit" class="form-label">Take Profit</label>
              <input type="number" name="takeProfit" id="takeProfit" class="form-control" step="0.00001" min="0">
            </div>

            <div class="mb-3">
              <label for="expiration" class="form-label">Expiration</label>
              <input type="text" name="expiration" id="expiration" class="form-control" placeholder="e.g. 1min, 5min">
            </div>

            <div class="mb-3">
              <label for="profitPercent" class="form-label">Profit Percent</label>
              <input type="number" name="profitPercent" id="profitPercent" class="form-control" step="1" min="0">
            </div>

            <div class="mb-3">
              <label for="status" class="form-label">Status</label>
              <select name="status" id="status" class="form-select" required>
                <option value="Open">Open</option>
                <option value="Closed">Closed</option>
                <option value="Won">Won</option>
                <option value="Lost">Lost</option>
              </select>
            </div>

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary">Update Trade</button>
              <a href="all-livetrade.html" class="btn btn-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="row clearfix">
      <div class="float-left">
        <span class="copy">&copy; 2022 <span>247Expertstrade Ltd .</span></span>
      </div>
    </div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="./public/js/config.js"></script>
<script src="./public/js/auth.js"></script>
<script src="./public/js/editTrade.js"></script>

<script>
  // Sidebar toggle
  (function () {
    const sidebar = document.getElementById('mainSidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const toggleBtn = document.getElementById('menuToggleBtn');

    function openSidebar() {
      if (sidebar) sidebar.classList.add('visible');
      if (overlay) overlay.classList.add('active');
      document.body.classList.add('dimmed');
    }
    function closeSidebar() {
      if (sidebar) sidebar.classList.remove('visible');
      if (overlay) overlay.classList.remove('active');
      document.body.classList.remove('dimmed');
    }
    function toggleSidebar() {
      if (sidebar && sidebar.classList.contains('visible')) closeSidebar();
      else openSidebar();
    }

    if (toggleBtn) {
      toggleBtn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        toggleSidebar();
      });
    }
    if (overlay) overlay.addEventListener('click', closeSidebar);
    if (sidebar) {
      sidebar.querySelectorAll('a').forEach(link => link.addEventListener('click', closeSidebar));
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSidebar(); });
  })();

  // Logout
  document.getElementById('adminLogoutBtn')?.addEventListener('click', e => { e.preventDefault(); logout(); });
  document.getElementById('topLogoutBtn')?.addEventListener('click', e => { e.preventDefault(); logout(); });
</script>
</body>
</html>
