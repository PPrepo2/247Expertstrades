                    function changeLanguageByButtonClick() {
                      var language = document.getElementById("language").value;
                      var selectField = document.querySelector("#google_translate_element select");
                      for(var i=0; i < selectField.children.length; i++){
                        var option = selectField.children[i];
                        // find desired langauge and change the former language of the hidden selection-field 
                        if(option.value==language){
                           selectField.selectedIndex = i;
                           // trigger change event afterwards to make google-lib translate this side
                           selectField.dispatchEvent(new Event('change'));
                           break;
                        }
                      }
                    }

<script>
document.getElementById('registerForm').addEventListener('submit', async function (e) {
  e.preventDefault();

  const btn = document.getElementById('registerBtn');
  const originalText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = 'Creating Account...';

  // Map original form fields exactly as they are
  const formData = {
    fname: document.getElementById('fname').value.trim(),
    lname: document.getElementById('lname').value.trim(),
    uname: document.getElementById('uname').value.trim(),
    pass: document.getElementById('pass').value,
    cpass: document.getElementById('cpass').value,
    title: document.getElementById('title').value.trim() || '',
    phone: document.getElementById('phone').value.trim(),
    email: document.getElementById('email').value.trim().toLowerCase(),
    country: document.getElementById('country').value.trim(),
    lev: document.querySelector('select[name="lev"]').value,
    currency: document.querySelector('select[name="currency"]').value,
    type: 'STATER',
    zip: ''
  };

  try {
    const response = await api.post('/register', formData);

    if (response.data.success) {
      localStorage.setItem('token', response.data.token);
      localStorage.setItem('user', JSON.stringify(response.data.user));

      await Swal.fire({
        icon: 'success',
        title: 'Registration Successful!',
        text: response.data.message || 'Your account has been created successfully.',
        confirmButtonColor: '#3085d6',
        confirmButtonText: 'Go to Dashboard'
      });

      window.location.href = response.data.redirect || 'dashboard.html';
    } else {
      throw new Error(response.data.message || 'Registration failed');
    }
  } catch (err) {
    console.error(err);

    let errorMsg = 'Registration failed. Please try again.';
    if (err.response && err.response.data) {
      const data = err.response.data;
      if (data.message) errorMsg = data.message;
      else if (data.errors) {
        const msgs = Object.values(data.errors).filter(Boolean);
        if (msgs.length) errorMsg = msgs.join(' • ');
      }
    } else if (err.message) {
      errorMsg = err.message;
    }

    Swal.fire({
      icon: 'error',
      title: 'Registration Failed',
      text: errorMsg,
      confirmButtonColor: '#d33'
    });
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
});
</script>
