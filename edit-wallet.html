      <div id="loadingState" class="text-center py-5">

      </div>

      <div id="errorState" class="alert alert-danger d-none"></div>

      <div class="card d-none" id="editCard">
        <div class="card-body">
          <form id="editWalletForm" enctype="multipart/form-data">
            
            <!-- Bank Details -->
            <div class="section-title">Bank Transfer Details</div>

            <div class="mb-3">
              <label for="bank_name" class="form-label">Bank Name</label>
              <input type="text" name="bank_name" id="bank_name" class="form-control">
            </div>

            <div class="mb-3">
              <label for="account_name" class="form-label">Account Name</label>
              <input type="text" name="account_name" id="account_name" class="form-control">
            </div>

            <div class="mb-3">
              <label for="account_no" class="form-label">Account Number</label>
              <input type="text" name="account_no" id="account_no" class="form-control">
            </div>

            <div class="mb-3">
              <label for="sortcode" class="form-label">Sort Code</label>
              <input type="text" name="sortcode" id="sortcode" class="form-control">
            </div>

            <div class="mb-3">
              <label for="swift_code" class="form-label">Swift Code</label>
              <input type="text" name="swift_code" id="swift_code" class="form-control">
            </div>

            <!-- Bitcoin -->
            <div class="section-title">Bitcoin / Crypto</div>

            <div class="mb-3">
              <label for="btc_wallet_address" class="form-label">BTC Wallet Address</label>
              <input type="text" name="btc_wallet_address" id="btc_wallet_address" class="form-control">
            </div>

            <div class="mb-3">
              <label for="btc_qr_image" class="form-label">BTC QR Code Image (Optional)</label>
              <input type="file" name="btc_qr_image" id="btc_qr_image" class="form-control" accept="image/*">
              <div id="currentQrPreview" class="mt-2 d-none">
                <p class="text-muted mb-1">Current QR Image:</p>
                <img id="currentQrImg" class="qr-preview" alt="Current BTC QR">
              </div>
            </div>

            <!-- PayPal -->
            <div class="section-title">PayPal</div>

            <div class="mb-3">
              <label for="paypal_email" class="form-label">PayPal Email</label>
              <input type="email" name="paypal_email" id="paypal_email" class="form-control">
            </div>

            <!-- Buttons -->
            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary" id="submitBtn">
                <i class="bi bi-check-circle"></i> Update Wallet
              </button>
              <a href="wallets.html" class="btn btn-secondary">Cancel</a>

<script>
  // Sidebar toggle
  (function () {
    const sidebar = document.getElementById('mainSidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const toggleBtn = document.getElementById('menuToggleBtn');

    function openSidebar() {
      if (sidebar) sidebar.classList.add('visible');
      if (overlay) overlay.classList.add('active');
      document.body.classList.add('dimmed');
    }
    function closeSidebar() {
      if (sidebar) sidebar.classList.remove('visible');
      if (overlay) overlay.classList.remove('active');
      document.body.classList.remove('dimmed');
    }
    function toggleSidebar() {
      if (sidebar && sidebar.classList.contains('visible')) closeSidebar();
      else openSidebar();
    }

    if (toggleBtn) {
      toggleBtn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        toggleSidebar();
      });
    }
    if (overlay) overlay.addEventListener('click', closeSidebar);
    if (sidebar) {
      sidebar.querySelectorAll('a').forEach(link => link.addEventListener('click', closeSidebar));
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSidebar(); });
  })();

  // Logout
  document.getElementById('adminLogoutBtn')?.addEventListener('click', e => { e.preventDefault(); logout(); });
  document.getElementById('topLogoutBtn')?.addEventListener('click', e => { e.preventDefault(); logout(); });
</script>
