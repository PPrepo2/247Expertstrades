<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>All Deposits | 247Expertstrade Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1">
  <link rel="icon" type="image/png" href="./assets/img/favicons/favicon-32x32.png" sizes="32x32">
  <link href="./assets/css/css.css" rel="stylesheet" type="text/css">
  <link rel="stylesheet" type="text/css" href="./assets/css/inner.css">
  <link rel="stylesheet" type="text/css" href="./assets/css/app.css">
  <link rel="stylesheet" type="text/css" href="./assets/css/cs.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <script src="https://use.fontawesome.com/4b789087e7.js"></script>
  <style>
    body { background: #0d0d0d; color: #fff; }
    .divider { border-bottom: 1px dotted; }
    .ui.sidebar.right {
      position: fixed !important; top: 0; right: -280px; width: 260px; height: 100%;
      z-index: 10000; transition: right 0.3s ease; overflow-y: auto; padding-top: 90px !important;
    }
    .ui.sidebar.right.visible { right: 0 !important; }
    .sidebar-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 9999;
    }
    .sidebar-overlay.active { display: block; }
    .menu-toggle { cursor: pointer !important; }
    .admin-wrap { padding: 24px 16px 80px; max-width: 1200px; margin: 0 auto; }
    .admin-wrap h2 { color: #fff; margin-bottom: 16px; }
    .table { color: #fff; }
    .table-dark { --bs-table-bg: #1a1a2e; --bs-table-color: #fff; }
    .table-dark td, .table-dark th { border-color: #333; vertical-align: middle; }
    .form-control, .form-select {
      background: #1a1a2e; color: #fff; border: 1px solid #444;
    }
    .form-control:focus, .form-select:focus {
      background: #1a1a2e; color: #fff; border-color: #2597c7; box-shadow: none;
    }
    .pagination .page-link { background: #1a1a2e; color: #fff; border-color: #333; }
    .pagination .page-item.active .page-link { background: #286090; border-color: #286090; }
    .badge { font-size: 0.85rem; }
    .filters-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
  </style>
</head>
<body class="pushable dimmable scrolling">

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="ui sidebar right inverted vertical menu" id="mainSidebar">
  <div class="item" style="font-size:small;color:#fff;position:absolute;top:15px;width:90%;">
    <span id="admin-sidebar-email"><i class="fa fa-envelope-o"></i> Admin</span><br>
    <span id="admin-sidebar-name" style="margin-top:8px;"><b>Loading...</b></span>
  </div>
  <span class="divider"></span>
  <div class="item"><a href="adminDashboard.html"><i class="fa fa-dashboard"></i> Users</a></div>
  <div class="item"><a href="allFunding.html"><i class="fa fa-money"></i> All Deposits</a></div>
  <div class="item"><a href="allWidthdrawals.html"><i class="fa fa-money"></i> All Withdrawals</a></div>
  <div class="item"><a href="all-livetrade.html"><i class="fa fa-area-chart"></i> All Trades</a></div>
  <div class="item"><a href="allVerify.html"><i class="fa fa-check-circle"></i> Verifications</a></div>
  <div class="item"><a href="wallets.html"><i class="fa fa-credit-card"></i> Wallets</a></div>
  <span class="divider"></span>
  <div class="item"><a href="#" id="adminLogoutBtn"><i class="fa fa-power-off"></i> Exit</a></div>
</div>

<div class="pusher">
  <nav class="top-nav inner inner-new">
    <div class="top-bar">
      <div class="head-row clearfix">
        <div class="float-left">
          <div class="logosm">
            <a href="adminDashboard.html"><img src="./assets/img/logo.png" alt="247Expertstrade"></a>
          </div>
        </div>
        <span class="menu-toggle float-right" id="menuToggleBtn"><i></i></span>
        <div class="float-right nav smcapy-nav">
          <div class="item" id="top-admin-name">Admin</div>
          <div class="item">
            <a class="ui button op link a-green-hover" href="#" id="topLogoutBtn">
              <i class="fa fa-power-off"></i> Exit
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="root-content">
    <div class="admin-wrap">
      <h2>Deposits</h2>

      <div class="filters-row">
        <input type="text" id="searchInput" class="form-control" style="max-width:220px;" placeholder="Search owner, amount...">
        <select id="statusFilter" class="form-select" style="max-width:160px;">
          <option value="all">All status</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="confirmed">Confirmed</option>
          <option value="rejected">Rejected</option>
          <option value="declined">Declined</option>
        </select>
        <button type="button" class="btn btn-primary btn-sm" id="searchBtn">Search</button>
        <button type="button" class="btn btn-secondary btn-sm" id="resetBtn">Reset</button>
      </div>

      <div class="table-responsive">
        <table class="table table-dark table-striped table-hover">
          <thead>
            <tr>
              <th>#</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Proof</th>
              <th>Narration</th>
              <th>Owner</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="depositsTableBody">
            <tr>
              <td colspan="9" class="text-center">Loading deposits...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <nav class="mt-3">
        <ul class="pagination justify-content-center" id="pagination"></ul>
      </nav>
      <p class="text-center text-secondary small" id="resultInfo"></p>
    </div>
  </div>

  <footer class="footer">
    <div class="row clearfix">
      <div class="float-left">
        <span class="copy">&copy; 2022 <span>247Expertstrade Ltd .</span></span>
      </div>
    </div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="/frontend/public/js/config.js"></script>
<script src="/frontend/public/js/auth.js"></script>
<script src="/frontend/public/js/allFunding.js"></script>
</body>
</html>
