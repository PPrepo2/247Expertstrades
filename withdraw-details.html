<script>
(function(){
  var sidebar=document.getElementById('mainSidebar');
  var overlay=document.getElementById('sidebarOverlay');
  var toggleBtn=document.getElementById('menuToggleBtn');
  function openS(){if(sidebar)sidebar.classList.add('visible');if(overlay)overlay.classList.add('active')}
  function closeS(){if(sidebar)sidebar.classList.remove('visible');if(overlay)overlay.classList.remove('active')}
  if(toggleBtn)toggleBtn.addEventListener('click',function(e){e.preventDefault();sidebar&&sidebar.classList.contains('visible')?closeS():openS()});
  if(overlay)overlay.addEventListener('click',closeS);
})();

document.addEventListener('DOMContentLoaded', async function(){
  if(typeof requireAuthPage==='function') requireAuthPage();

  var amount=localStorage.getItem('withdraw_amount');
  var type=localStorage.getItem('withdraw_type');
  var fees=localStorage.getItem('withdraw_fees')||'0.00';

  if(!amount||!type){
    Swal.fire('Error','Start withdrawal from the previous page','error').then(function(){
      window.location.href='withdrawal.html';
    });
    return;
  }

  document.getElementById('show-amount').textContent=amount;
  document.getElementById('show-type').textContent=type;
  document.getElementById('amount').value=amount;
  document.getElementById('fees').value=fees;

  document.querySelectorAll('.field-group').forEach(function(g){g.classList.remove('active')});
  if(type==='Bitcoin'||type==='Ethereum'||type==='USDT'){
    document.getElementById('group-crypto').classList.add('active');
    document.getElementById('crypto-label').textContent=type+' wallet address';
  } else if(type==='CashApp'){
    document.getElementById('group-cashapp').classList.add('active');
  } else if(type==='PayPal'){
    document.getElementById('group-paypal').classList.add('active');
  } else if(type==='Bank Transfer'){
    document.getElementById('group-bank').classList.add('active');
  }

  try{
    var res=await api.get('/withdraw');
    if(res.data&&res.data.success){
      var u=res.data.user;
      var bal=Number(u.balance||0).toFixed(2);
      document.getElementById('sidebar-email').innerHTML='<i class="fa fa-envelope-o"></i> '+(u.email||'');
      document.getElementById('sidebar-balance').innerHTML='<b><i class="fa fa-money"></i> '+bal+'</b>';
      var kyc=u.kycVerified==='approve'
        ? 'Kyc Verification: <span class="blinkgreen"><i class="fa fa-check-circle"></i> Verified</span>'
        : 'Kyc Verification: <span class="blinkred"><i class="fa fa-check-circle"></i> Required</span>';
      document.getElementById('sidebar-kyc').innerHTML=kyc;
      document.getElementById('top-kyc').innerHTML=kyc;
    }
  }catch(e){}

  document.getElementById('detailsNext').addEventListener('click', function(){
    var narration=document.getElementById('narration').value.trim();
    localStorage.setItem('withdraw_narration', narration);

    if(type==='Bitcoin'||type==='Ethereum'||type==='USDT'){
      var wa=document.getElementById('walletAddress').value.trim();
      if(!wa){ Swal.fire('Error','Wallet address is required','error'); return; }
      localStorage.setItem('withdraw_walletAddress', wa);
    } else if(type==='CashApp'){
      var tag=document.getElementById('cashAppTag').value.trim();
      if(!tag){ Swal.fire('Error','CashApp tag is required','error'); return; }
      localStorage.setItem('withdraw_cashAppTag', tag);
    } else if(type==='PayPal'){
      var em=document.getElementById('paypalEmail').value.trim();
      if(!em){ Swal.fire('Error','PayPal email is required','error'); return; }
      localStorage.setItem('withdraw_paypalEmail', em);
    } else if(type==='Bank Transfer'){
      var bn=document.getElementById('bankName').value.trim();
      var an=document.getElementById('accountNumber').value.trim();
      var co=document.getElementById('country').value.trim();
      var sw=document.getElementById('swiftCode').value.trim();
      if(!bn||!an||!co||!sw){
        Swal.fire('Error','All bank fields are required','error');
        return;
      }
      localStorage.setItem('withdraw_bankName', bn);
      localStorage.setItem('withdraw_accountNumber', an);
      localStorage.setItem('withdraw_country', co);
      localStorage.setItem('withdraw_swiftCode', sw);
    }

    window.location.href='withdraw-verification.html';
  });
});
</script>
