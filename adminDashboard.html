<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Admin Dashboard | 247Expertstrade</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1">
  <link rel="icon" type="image/png" href="./assets/img/favicons/favicon-32x32.png" sizes="32x32">
  <link href="./assets/css/css.css" rel="stylesheet" type="text/css">
  <link rel="stylesheet" type="text/css" href="./assets/css/inner.css">
  <link rel="stylesheet" type="text/css" href="./assets/css/app.css">
  <link rel="stylesheet" type="text/css" href="./assets/css/cs.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <script src="https://use.fontawesome.com/4b789087e7.js"></script>
  <style>
    body { background: #0d0d0d; color: #fff; }
    .divider { border-bottom: 1px dotted; }
    .ui.sidebar.right {
      position: fixed !important; top: 0; right: -280px; width: 260px; height: 100%;
      z-index: 10000; transition: right 0.3s ease; overflow-y: auto; padding-top: 90px !important;
    }
    .ui.sidebar.right.visible { right: 0 !important; }
    .sidebar-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 9999;
    }
    .sidebar-overlay.active { display: block; }
    .menu-toggle { cursor: pointer !important; }
    .admin-wrap { padding: 24px 16px 80px; max-width: 1200px; margin: 0 auto; }
    .admin-wrap h2 { color: #fff; margin-bottom: 16px; }
    .table { color: #fff; background-color: #171717; }
    .table-dark { --bs-table-bg: #1a1a2e; }
    .card { background: #171717; border: none; border-radius: 0.5rem; }
    .form-control, .form-select {
      background: #1a1a2e; color: #fff; border: 1px solid #444;
    }
    .form-control:focus, .form-select:focus {
      background: #1a1a2e; color: #fff; border-color: #2597c7; box-shadow: none;
    }
    .btn-sm { padding: 0.25rem 0.5rem; }
    .pagination .page-link { background: #1a1a2e; color: #fff; border-color: #333; }
    .pagination .page-item.active .page-link { background: #286090; border-color: #286090; }
    .badge { font-size: 0.85rem; }
  </style>
</head>
<body class="pushable dimmable scrolling">

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="ui sidebar right inverted vertical menu" id="mainSidebar">
  <div class="item" style="font-size:small;color:#fff;position:absolute;top:15px;width:90%;">
    <span id="admin-sidebar-email"><i class="fa fa-envelope-o"></i> Admin</span><br>
    <span id="admin-sidebar-name" style="margin-top:8px;"><b>Loading...</b></span>
  </div>
  <span class="divider"></span>
  <div class="item"><a href="adminDashboard.html"><i class="fa fa-dashboard"></i> Users</a></div>
  <div class="item"><a href="allFunding.html"><i class="fa fa-money"></i> All Deposits</a></div>
  <div class="item"><a href="allWidthdrawals.html"><i class="fa fa-money"></i> All Withdrawals</a></div>
  <div class="item"><a href="all-livetrade.html"><i class="fa fa-area-chart"></i> All Trades</a></div>
  <div class="item"><a href="allVerify.html"><i class="fa fa-check-circle"></i> Verifications</a></div>
  <div class="item"><a href="wallets.html"><i class="fa fa-credit-card"></i> Wallets</a></div>
  <span class="divider"></span>
  <div class="item"><a href="#" id="adminLogoutBtn"><i class="fa fa-power-off"></i> Exit</a></div>
</div>

<div class="pusher">
  <nav class="top-nav inner inner-new">
    <div class="top-bar">
      <div class="head-row clearfix">
        <div class="float-left">
          <div class="logosm">
            <a href="adminDashboard.html"><img src="./assets/img/logo.png" alt="247Expertstrade"></a>
          </div>
        </div>
        <span class="menu-toggle float-right" id="menuToggleBtn"><i></i></span>
        <div class="float-right nav smcapy-nav">
          <div class="item" id="top-admin-name">Admin</div>
          <div class="item">
            <a class="ui button op link a-green-hover" href="#" id="topLogoutBtn">
              <i class="fa fa-power-off"></i> Exit
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="root-content">
    <div class="admin-wrap">
      <h2>Admin Dashboard — Users</h2>

      <div class="row mb-3 g-2 align-items-end">
        <div class="col-md-6">
          <label class="form-label">Search</label>
          <div class="input-group">
            <input type="text" id="searchInput" class="form-control" placeholder="Name, email, phone, country">
            <button type="button" class="btn btn-primary" id="searchBtn">
              <i class="bi bi-search"></i> Search
            </button>
          </div>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="statusFilter">Filter by Status</label>
          <select id="statusFilter" class="form-select">
            <option value="all">All</option>
            <option value="active">Active</option>
            <option value="suspended">Suspended</option>
          </select>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover table-striped align-middle mb-0">
              <thead class="table-dark">
                <tr>
                  <th>S/N</th>
                  <th><a href="#" class="text-white text-decoration-none sort-link" data-sort="fullname">Full Name</a></th>
                  <th><a href="#" class="text-white text-decoration-none sort-link" data-sort="email">Email</a></th>
                  <th><a href="#" class="text-white text-decoration-none sort-link" data-sort="country">Country</a></th>
                  <th><a href="#" class="text-white text-decoration-none sort-link" data-sort="tel">Telephone</a></th>
                  <th>Balance</th>
                  <th><a href="#" class="text-white text-decoration-none sort-link" data-sort="isSuspended">Status</a></th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="usersTableBody">
                <tr>
                  <td colspan="8" class="text-center py-4">Loading users...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <nav aria-label="Pagination" class="mt-4">
        <ul class="pagination justify-content-center" id="pagination"></ul>
      </nav>
    </div>
  </div>

  <footer class="footer">
    <div class="row clearfix">
      <div class="float-left">
        <span class="copy">&copy; 2022 <span>247Expertstrade Ltd .</span></span>
      </div>
    </div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="/frontend/public/js/config.js"></script>
<script src="/frontend/public/js/auth.js"></script>
<script src="/frontend/public/js/adminDashboard.js"></script>
</body>
</html>
