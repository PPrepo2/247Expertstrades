    body { background: #0d0d0d; color: #fff; }
    .divider { border-bottom: 1px dotted; }
    .ui.sidebar.right {
      position: fixed !important; top: 0; right: -280px; width: 260px; height: 100%;
      z-index: 10000; transition: right 0.3s ease; overflow-y: auto; padding-top: 90px !important;
    }
    .ui.sidebar.right.visible { right: 0 !important; }
    .sidebar-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 9999;
    }
    .sidebar-overlay.active { display: block; }
    .menu-toggle { cursor: pointer !important; }
    .admin-wrap { padding: 24px 16px 80px; max-width: 900px; margin: 0 auto; }
    .admin-wrap h2 { color: #fff; margin-bottom: 20px; }
    .card { background: #171717; border: none; border-radius: 0.5rem; }
    .form-control, .form-select {
      background: #1a1a2e; color: #fff; border: 1px solid #444;
    }
    .form-control:focus, .form-select:focus {
      background: #1a1a2e; color: #fff; border-color: #2597c7; box-shadow: none;
    }
    .form-control-static { padding: 0.5rem 0; color: #ccc; }
    label { color: #ddd; font-weight: 500; }

    .btn-primary:hover { background-color: #1f4a6b; border-color: #1f4a6b; }

      max-width: 100%;
      max-height: 220px;
      border-radius: 8px;
      border: 1px solid #333;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .doc-img:hover { transform: scale(1.03); }
    .img-label { color: #aaa; font-size: 0.9rem; margin-bottom: 6px; }
  </style>

  <div class="item"><a href="adminDashboard.html"><i class="fa fa-dashboard"></i> Users</a></div>

<div class="pusher">
  <nav class="top-nav inner inner-new">
    <div class="top-bar">
      <div class="head-row clearfix">
        <div class="float-left">
          <div class="logosm">
            <a href="adminDashboard.html"><img src="./assets/img/logo.png" alt="247Expertstrade"></a>
          </div>
        </div>
        <span class="menu-toggle float-right" id="menuToggleBtn"><i></i></span>
        <div class="float-right nav smcapy-nav">
          <div class="item" id="top-admin-name">Admin</div>

              <i class="fa fa-power-off"></i> Exit
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="root-content">
    <div class="admin-wrap">
      <h2>Review / Edit Verification</h2>

      <div id="loadingState" class="text-center py-5">
        <i class="fa fa-spinner fa-spin fa-2x"></i>
        <p class="mt-2">Loading verification...</p>
      </div>

      <div id="errorState" class="alert alert-danger d-none"></div>

      <div class="card d-none" id="editCard">
        <div class="card-body">
          <form id="editVerifyForm">
            <!-- User Info (read-only) -->
            <div class="mb-3">
              <label class="form-label">User</label>
              <p class="form-control-static" id="userDisplay">—</p>
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <p class="form-control-static" id="emailDisplay">—</p>
            </div>

            <div class="mb-3">
              <label class="form-label">Document Type</label>
              <p class="form-control-static" id="docTypeDisplay">—</p>
            </div>

            <!-- Status -->
            <div class="mb-3">
              <label for="status" class="form-label">Status</label>
              <select name="status" id="status" class="form-select" required>
                <option value="pending">Pending</option>
                <option value="under review">Under Review</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
                <option value="declined">Declined</option>
              </select>
            </div>

            <!-- Rejection Reason (shown only when rejected/declined) -->
            <div class="mb-3 d-none" id="rejectionReasonGroup">
              <label for="rejectionReason" class="form-label">Rejection / Decline Reason</label>
              <textarea name="rejectionReason" id="rejectionReason" class="form-control" rows="3"
                        placeholder="Enter the reason for rejection or decline..."></textarea>
            </div>

            <!-- Images Preview -->
            <div class="mb-4">
              <h5 class="text-white mb-3">Uploaded Documents</h5>
              <div class="row g-3">
                <div class="col-md-4">
                  <div class="img-label">Front Side</div>
                  <img id="frontImg" class="doc-img d-none" alt="Front side" onclick="window.open(this.src, '_blank')">
                  <div id="frontImgPlaceholder" class="text-muted">No image</div>
                </div>
                <div class="col-md-4">
                  <div class="img-label">Back Side</div>
                  <img id="backImg" class="doc-img d-none" alt="Back side" onclick="window.open(this.src, '_blank')">
                  <div id="backImgPlaceholder" class="text-muted">No image</div>
                </div>
                <div class="col-md-4">
                  <div class="img-label">Passport Photo</div>
                  <img id="photoImg" class="doc-img d-none" alt="Photo" onclick="window.open(this.src, '_blank')">
                  <div id="photoImgPlaceholder" class="text-muted">No image</div>
                </div>
              </div>
            </div>

            <!-- Buttons -->
            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle"></i> Update Verification
              </button>
              <a href="allVerify.html" class="btn btn-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="row clearfix">
      <div class="float-left">
        <span class="copy">&copy; 2022 <span>247Expertstrade Ltd .</span></span>

  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="/frontend/public/js/config.js"></script>
<script src="/frontend/public/js/auth.js"></script>
<script src="/frontend/public/js/editVerify.js"></script>

<script>
  // Sidebar toggle
  (function () {
    const sidebar = document.getElementById('mainSidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const toggleBtn = document.getElementById('menuToggleBtn');

    function openSidebar() {
      if (sidebar) sidebar.classList.add('visible');
      if (overlay) overlay.classList.add('active');
      document.body.classList.add('dimmed');
    }
    function closeSidebar() {
      if (sidebar) sidebar.classList.remove('visible');
      if (overlay) overlay.classList.remove('active');
      document.body.classList.remove('dimmed');
    }
    function toggleSidebar() {
      if (sidebar && sidebar.classList.contains('visible')) closeSidebar();
      else openSidebar();
    }

    if (toggleBtn) {
      toggleBtn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        toggleSidebar();
      });
    }
    if (overlay) overlay.addEventListener('click', closeSidebar);
    if (sidebar) {
      sidebar.querySelectorAll('a').forEach(link => link.addEventListener('click', closeSidebar));
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSidebar(); });
  })();

  // Logout
  document.getElementById('adminLogoutBtn')?.addEventListener('click', e => { e.preventDefault(); logout(); });
  document.getElementById('topLogoutBtn')?.addEventListener('click', e => { e.preventDefault(); logout(); });
</script>
</body>
